# Deploy sul NUC (ARCHITECTURE.md §8). Nessun servizio Postgres qui: HomeHub si
# collega all'istanza Postgres già esistente sulla LAN (vedi backend/.env).
#
# Un solo punto d'ingresso esposto (frontend, porta host 8444 → router
# forwardato su 8444 esterna/interna): il backend NON pubblica più la sua
# porta sull'host, è raggiungibile solo dal container frontend via rete
# Docker interna (proxy /api in frontend/nginx.conf).
# Autenticazione: login unico dell'app (APP_PASSWORD_HASH in backend/.env),
# non più Basic Auth di nginx — vedi DEPLOY.md §4.

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      # sessione Garmin (creata da scripts/garmin_login_setup.py): senza
      # questo volume, ogni rebuild dell'immagine la perderebbe e servirebbe
      # rifare il login/MFA manuale
      - ./backend/.garmin_tokens:/app/.garmin_tokens
    restart: always
    # niente "ports": non deve essere raggiungibile dall'host/LAN/router,
    # solo dal container frontend tramite la rete Docker interna

  frontend:
    build: ./frontend
    ports:
      - "8444:80"
    depends_on:
      - backend
    restart: always
