# Un solo entrypoint per tutto: serve la SPA e fa da reverse proxy verso il
# backend (che quindi non va mai esposto direttamente sulla porta 8000 fuori
# dalla rete Docker interna). Vedi DEPLOY.md per il modello di sicurezza.
#
# --- Basic Auth per l'accesso da fuori LAN: TEMPORANEAMENTE DISABILITATA ---
# Disattivata su richiesta esplicita durante lo sviluppo (Chrome/Edge non
# mostravano il popup, bloccando il lavoro da remoto). In questo momento
# la porta esposta sul router (8444) è raggiungibile da chiunque su
# internet SENZA alcuna autenticazione, in lettura e scrittura (calendario,
# spesa, inventory, ecc — vedi ARCHITECTURE.md §6). Da ripristinare prima di
# lasciare l'accesso esterno attivo in modo permanente: basta togliere i "#"
# dalle righe "satisfy any / allow / deny / auth_basic" qui sotto (il file
# .htpasswd creato in precedenza è ancora lì, pronto all'uso) e rifare
# `docker compose up -d --build`. In alternativa, più semplice e definitivo:
# rimuovere la regola di port forward 8444 dal router quando l'accesso da
# fuori casa non serve più.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        # satisfy any;
        # allow 192.168.1.0/24;
        # allow 172.16.0.0/12;
        # allow 127.0.0.1;
        # deny all;
        # auth_basic "HomeHub";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        try_files $uri /index.html;
    }

    location /api/ {
        # satisfy any;
        # allow 192.168.1.0/24;
        # allow 172.16.0.0/12;
        # allow 127.0.0.1;
        # deny all;
        # auth_basic "HomeHub";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
