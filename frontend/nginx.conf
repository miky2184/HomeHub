# Un solo entrypoint per tutto: serve la SPA e fa da reverse proxy verso il
# backend (che quindi non va mai esposto direttamente sulla porta 8000 fuori
# dalla rete Docker interna). Vedi DEPLOY.md per il modello di sicurezza.
#
# L'autenticazione (login unico e condiviso, cookie di sessione di 30
# giorni) è gestita dall'app stessa, non più da nginx: vedi
# backend/app/core/auth.py e il middleware in backend/app/main.py. Prima
# c'era una Basic Auth qui (auth_basic), rimossa perché il popup nativo del
# browser veniva bloccato in silenzio da Chrome/Edge con policy aziendali —
# un form di login normale non ha questo problema.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
