# Un solo entrypoint per tutto: serve la SPA e fa da reverse proxy verso il
# backend (che quindi non va mai esposto direttamente sulla porta 8000 fuori
# dalla rete Docker interna). Vedi DEPLOY.md per il modello di sicurezza.
#
# Regola d'oro: dalla LAN di casa (incluso il kiosk stesso sul NUC, via
# localhost) nessun login richiesto; da fuori casa (es. porta forwardata sul
# router) serve la Basic Auth configurata in .htpasswd.
#
# NB: adatta "192.168.1.0/24" alla subnet reale della tua LAN se diversa
# (controlla con `ip addr` sul NUC o l'IP del tuo router).
#
# NB2: 172.16.0.0/12 copre le subnet dei bridge Docker (di norma
# 172.17-31.x.x). Serve perché il traffico da "localhost" sul NUC, passando
# per il port mapping di Docker, arriva a nginx con un IP sorgente NAT-ato
# nel bridge (non 127.0.0.1) — senza questa riga anche il kiosk sul NUC
# stesso si vedrebbe richiedere la password. È un range privato, quindi
# sicuro da whitelistare: nessun client su internet può presentarsi con un
# IP sorgente in quel blocco in una connessione TCP reale.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        satisfy any;
        allow 192.168.1.0/24;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        auth_basic "HomeHub";
        auth_basic_user_file /etc/nginx/.htpasswd;

        try_files $uri /index.html;
    }

    location /api/ {
        satisfy any;
        allow 192.168.1.0/24;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        auth_basic "HomeHub";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
