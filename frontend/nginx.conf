# Un solo entrypoint per tutto: serve la SPA e fa da reverse proxy verso il
# backend (che quindi non va mai esposto direttamente sulla porta 8000 fuori
# dalla rete Docker interna). Vedi DEPLOY.md per il modello di sicurezza.
#
# Regola d'oro: dalla LAN di casa nessun login richiesto (kiosk a zero
# attrito); da fuori casa (es. porta forwardata sul router) serve la Basic
# Auth configurata in .htpasswd.
#
# NB: adatta il blocco "allow" alla subnet reale della tua LAN se diversa da
# 192.168.1.0/24 (controlla con `ip addr` sul NUC o l'IP del tuo router).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        satisfy any;
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;
        auth_basic "HomeHub";
        auth_basic_user_file /etc/nginx/.htpasswd;

        try_files $uri /index.html;
    }

    location /api/ {
        satisfy any;
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;
        auth_basic "HomeHub";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
